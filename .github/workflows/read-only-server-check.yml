name: Capture vendor ingress timing
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          umask 077
          root=/home/ubuntu/server/forest-vendor-integration/data/diagnostics
          mkdir -p "$root"
          chmod 700 "$root"
          capdir=$(mktemp -d "$root/lpwa-20261117-XXXXXX")
          printf '%s' '' | base64 -d > "$capdir/analyze.py"
          vendor_ip=$(docker inspect --format '{{(index .NetworkSettings.Networks "forest-backend").IPAddress}}' forest-vendor-integration)
          network_id=$(docker network inspect --format '{{.Id}}' forest-backend)
          bridge="br-${network_id:0:12}"
          date -Is
          timedatectl show -p NTPSynchronized || true
          set +e
          sudo timeout -s INT 40 tcpdump -Z root -i "$bridge" -nn -s 0 -U -w "$capdir/vendor.pcap" "dst host $vendor_ip and tcp dst port 18010" 2> "$capdir/capture-stats.txt"
          result=$?
          set -e
          test "$result" = 0 || test "$result" = 124
          sudo chown "$(id -u):$(id -g)" "$capdir/vendor.pcap"
          chmod 600 "$capdir/vendor.pcap"
          sleep 3
          docker exec forest-core-server node --env-file-if-exists=.env --input-type=module -e 'import {DatabaseSync} from "node:sqlite"; import {config} from "./dist/config.js"; const db=new DatabaseSync(config.sqlitePath,{readOnly:true}); const rows=db.prepare("SELECT event_external_id,received_at FROM vendor_message INDEXED BY idx_vendor_message_device_received WHERE source_device_id=? ORDER BY received_at DESC LIMIT 300").all("240a0e37-b53c-4612-83ab-a6a834a70811"); console.log(JSON.stringify(rows.map(r=>({eventExternalId:r.event_external_id,receivedAt:r.received_at})))); db.close();' > "$capdir/core-times.json"
          python3 "$capdir/analyze.py" "$capdir/vendor.pcap" "$capdir/core-times.json" | tee "$capdir/comparison.json"
          cat "$capdir/capture-stats.txt"
          echo "private_capture_directory=$capdir"
          REMOTE
name: Inspect packet capture tools
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check capture tools via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          date -Is
          for tool in tcpdump tshark python3; do command -v "$tool" || true; done
          sudo -n true && echo capture_privileges_available
          docker inspect --format '{{(index .NetworkSettings.Networks "forest-backend").IPAddress}}' forest-vendor-integration
          docker network inspect --format '{{.Id}}' forest-backend
          REMOTE
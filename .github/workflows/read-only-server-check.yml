name: Verify outage prevention
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          systemctl is-enabled forest-api-watchdog.timer
          systemctl is-active forest-api-watchdog.timer
          systemctl show forest-api-watchdog.service -p Result -p ExecMainStatus
          docker inspect --format '{{.Name}} health={{.State.Health.Status}}' forest-core-server forest-vendor-integration
          docker logs --since 5m forest-vendor-integration 2>&1 | python3 -c 'import sys;lines=sys.stdin.read().splitlines();print("worker_ready",sum("[core-log-worker] ready" in x for x in lines));print("worker_errors",sum("[core-log-worker]" in x and "ready" not in x for x in lines))'
          for attempt in $(seq 1 12); do
            curl -fsS -o /dev/null --max-time 5 -w 'quality http=%{http_code} time=%{time_total}\n' 'http://127.0.0.1:18020/api/v1/dashboard/network-quality/sleno?limit=2000'
            curl -fsS -o /dev/null --max-time 5 -w 'vendor-health http=%{http_code} time=%{time_total}\n' 'http://127.0.0.1:18010/JININFRA/health'
            curl -fsS -o /dev/null --max-time 3 -w 'core-health http=%{http_code} time=%{time_total}\n' http://127.0.0.1:18020/health
            sleep 3
          done
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' forest-vendor-integration forest-core-server
          docker inspect --format '{{.Name}} final health={{.State.Health.Status}}' forest-core-server forest-vendor-integration
          systemctl show forest-api-watchdog.service -p Result -p ExecMainStatus
          REMOTE

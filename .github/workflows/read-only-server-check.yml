name: Capture vendor ingress timing
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          docker exec forest-core-server node --env-file-if-exists=.env --input-type=module -e 'import {DatabaseSync} from "node:sqlite";import {config} from "./dist/config.js";const db=new DatabaseSync(config.sqlitePath,{readOnly:true});db.exec("PRAGMA busy_timeout=10000");console.log(JSON.stringify(db.prepare("SELECT name,sql FROM sqlite_master WHERE type=? AND name IN (?,?)").all("index","idx_vendor_message_vendor_received","idx_vendor_message_device_received")));db.close();'
          REMOTE

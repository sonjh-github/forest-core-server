name: Assign requested vehicle
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
concurrency:
  group: forest-core-server-production
  cancel-in-progress: false
jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            python3 - <<'PY'
            import sqlite3,uuid,datetime
            db=sqlite3.connect('/home/ubuntu/server/forest-core-server/data/forest.sqlite',timeout=10)
            db.execute('PRAGMA foreign_keys=ON')
            event='10000000-0000-4000-8000-000000000001'
            asset='e89eb39e-4229-459a-b57e-5f22318cd881'
            db.execute('BEGIN IMMEDIATE')
            assert db.execute('SELECT 1 FROM disaster_event WHERE event_id=?',(event,)).fetchone()
            assert db.execute('SELECT 1 FROM asset WHERE asset_id=? AND asset_code=?',(asset,'SIM-RTK-CAR-01')).fetchone()
            now=datetime.datetime.now(datetime.timezone.utc).isoformat()
            db.execute('INSERT INTO event_resource(event_resource_id,event_id,asset_id,mission,assigned_at,released_at) VALUES(?,?,?,?,?,NULL) ON CONFLICT(event_id,asset_id) DO UPDATE SET released_at=NULL', (str(uuid.uuid4()),event,asset,'차량 위치 송신',now))
            db.commit()
            assert db.execute('SELECT 1 FROM event_resource WHERE event_id=? AND asset_id=? AND released_at IS NULL',(event,asset)).fetchone()
            print('VEHICLE_ASSIGNMENT_VERIFIED')
            db.close()
            PY
name: Recover unhealthy core
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
concurrency:
  group: forest-core-server-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' forest-core-server)
            if [ "$health" = unhealthy ]; then
              docker restart --time 10 forest-core-server
            fi
            for attempt in $(seq 1 20); do
              if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:18020/health; then
                echo 'Core health recovered'
                break
              fi
              sleep 2
            done
            docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' forest-core-server
            curl -fsS -o /dev/null --max-time 5 -w 'core http=%{http_code}\n' http://127.0.0.1:18020/health
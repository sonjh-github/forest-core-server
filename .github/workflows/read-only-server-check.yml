name: Update requested disaster location
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
concurrency:
  group: forest-core-server-production
  cancel-in-progress: false
jobs:
  update-location:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            python3 - <<'PY'
            import sqlite3,json,pathlib,datetime
            root=pathlib.Path('/home/ubuntu/server/forest-core-server/data')
            db=sqlite3.connect(root/'forest.sqlite',timeout=10)
            event='10000000-0000-4000-8000-000000000001'
            address='충청남도 예산군 덕산면 상가리 산5-23'
            db.execute('BEGIN IMMEDIATE')
            row=db.execute('SELECT metadata_json FROM disaster_event WHERE event_id=?',(event,)).fetchone()
            assert row is not None,'Existing disaster missing'
            meta=json.loads(row[0])
            backup=root/'location-backups'
            backup.mkdir(exist_ok=True)
            stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
            (backup/(stamp+'.json')).write_text(json.dumps({'event_id':event,'metadata_json':row[0]},ensure_ascii=False),encoding='utf-8')
            meta['location_name']=address
            meta['geometry']={'type':'Point','coordinates':[126.61705287350944,36.72049103394032]}
            result=db.execute('UPDATE disaster_event SET metadata_json=? WHERE event_id=?',(json.dumps(meta,ensure_ascii=False),event))
            assert result.rowcount==1
            db.commit()
            saved=json.loads(db.execute('SELECT metadata_json FROM disaster_event WHERE event_id=?',(event,)).fetchone()[0])
            assert saved['location_name']==address and saved['geometry']==meta['geometry']
            print('DISASTER_LOCATION_UPDATE_VERIFIED')
            db.close()
            PY
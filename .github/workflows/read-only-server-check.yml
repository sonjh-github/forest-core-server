name: Capture vendor ingress timing
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' forest-vendor-integration forest-core-server
          docker exec forest-vendor-integration node --env-file-if-exists=.env --input-type=module -e 'import {DatabaseSync} from "node:sqlite"; const db=new DatabaseSync("/app/data/core-log-queue.sqlite",{readOnly:true}); console.log("queue",db.prepare("SELECT COUNT(*) AS pending FROM pending_log").get()); for(const hint of [""," NOT INDEXED"]){const sql="SELECT * FROM pending_log"+hint+" WHERE next_attempt_at<=? ORDER BY id DESC LIMIT 1";console.log("plan",hint,db.prepare("EXPLAIN QUERY PLAN "+sql).all(Date.now()).map(x=>x.detail)); const start=performance.now();const r=db.prepare(sql).get(Date.now());console.log("lookup",hint,"ms",performance.now()-start,"id",r?.id);} db.close();'
          REMOTE

name: Verify outage prevention
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          for url in 'https://example.com' 'http://api.open-meteo.com/v1/forecast?latitude=36.72&longitude=126.61&current=temperature_2m' 'https://api.open-meteo.com/v1/forecast?latitude=36.72&longitude=126.61&current=temperature_2m' 'https://dns.google/resolve?name=api.open-meteo.com&type=A' 'https://geocoding-api.open-meteo.com/v1/search?name=Yesan&count=1'; do
            echo "CHECK $url"
            curl -sS --max-time 6 -w '\nhttp=%{http_code} ip=%{remote_ip} time=%{time_total}\n' "$url" || true
          done
          getent ahostsv4 api.open-meteo.com
          REMOTE

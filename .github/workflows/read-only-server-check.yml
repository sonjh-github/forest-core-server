name: Capture vendor ingress timing
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          capdir=/home/ubuntu/server/forest-vendor-integration/data/diagnostics/lpwa-20261117-V6FbdG
          docker exec -i forest-core-server node --env-file-if-exists=.env --input-type=module -e 'import fs from "node:fs"; import {DatabaseSync} from "node:sqlite"; import {config} from "./dist/config.js"; const report=JSON.parse(fs.readFileSync(0,"utf8")); const wanted=new Set(report.samples.map(x=>x.eventExternalId)); const since=new Date(Math.min(...report.samples.map(x=>Date.parse(x.wireFirstByteAt)))-60000).toISOString(); const db=new DatabaseSync(config.sqlitePath,{readOnly:true}); const rows=db.prepare("SELECT logged_at,received_at,status_code,duration_ms,request_body_json,response_body_json FROM vendor_request_log WHERE received_at>=? ORDER BY received_at DESC LIMIT 5000").all(since); const matches=[];for(const r of rows){let request,response;try{request=JSON.parse(r.request_body_json);response=JSON.parse(r.response_body_json)}catch{continue}const id=request?.context?.eventExternalId;if(wanted.has(id))matches.push({eventExternalId:id,frameCounter:request.data?.frameCounter,loggedAt:r.logged_at,status:r.status_code,durationMs:r.duration_ms,error:response?.error?.code,unmapped:response?.error?.unmappedDeviceIds});} console.log(JSON.stringify({matchedLogRecords:matches.length,records:matches},null,2));db.close();' < "$capdir/comparison.json" | tee "$capdir/response-correlation.json"
          REMOTE

name: Verify outage prevention
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          docker inspect --format '{{.Name}} health={{.State.Health.Status}}' forest-core-server
          curl -sS --max-time 20 -w '\nprovider-host http=%{http_code} time=%{time_total}\n' 'https://api.open-meteo.com/v1/forecast?latitude=36.72&longitude=126.61&current=temperature_2m&timeformat=unixtime' || true
          docker exec -i forest-core-server node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';
          console.log('dns', await dns.lookup('api.open-meteo.com',{all:true}));
          for (const url of ['https://api.open-meteo.com/v1/forecast?latitude=36.72&longitude=126.61&current=temperature_2m&timeformat=unixtime','https://api.open-meteo.com/v1/forecast?latitude=36.72049103394032&longitude=126.61705287350944&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,surface_pressure&wind_speed_unit=ms&timeformat=unixtime&timezone=Asia%2FSeoul']) {
          const start=Date.now(); try { const r=await fetch(url,{signal:AbortSignal.timeout(20000)}); console.log('provider-container',r.status,Date.now()-start,await r.text()); } catch(e){console.log('provider-error',Date.now()-start,e.message,e.cause?.code);}
          }
          NODE
          REMOTE

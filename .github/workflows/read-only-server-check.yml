name: Inspect core outage
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            date -Is
            docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' forest-core-server forest-vendor-integration forest-front-wildfire
            docker inspect --format 'status={{.State.Status}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' forest-core-server
            curl -s -o /dev/null --max-time 5 -w 'local core http=%{http_code} time=%{time_total}\n' http://127.0.0.1:18020/health || true
            free -m
            df -h /home/ubuntu/server/forest-core-server/data
            docker logs --since 2h --tail 10000 forest-core-server 2>&1 | python3 -c 'import sys,collections,re; s=sys.stdin.read(); print("error_counts",{k:len(re.findall(k,s,re.I)) for k in ["SQLITE_BUSY","SQLITE_CORRUPT","out of memory","uncaught","TypeError","Error:"]}); a=re.findall(r"\[request:(?:start|end)\] [A-Z]+ /[a-zA-Z0-9/_:-]+(?: [0-9]{3} [0-9]+ms)?",s); print("last_request_markers",a[-12:])'
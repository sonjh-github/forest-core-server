name: Verify API recovery
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify through native SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /home/ubuntu/server/forest-core-server
          git rev-parse --short HEAD
          docker inspect --format 'health={{.State.Health.Status}} oom={{.State.OOMKilled}}' forest-core-server
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' forest-core-server
          for attempt in $(seq 1 12); do
            curl -fsS -o /dev/null --max-time 8 -w 'quality http=%{http_code} time=%{time_total}\n' 'http://127.0.0.1:18020/api/v1/dashboard/network-quality/sleno?limit=2000'
            curl -fsS -o /dev/null --max-time 3 -w 'health http=%{http_code} time=%{time_total}\n' http://127.0.0.1:18020/health
            sleep 3
          done
          docker inspect --format 'final health={{.State.Health.Status}}' forest-core-server
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' forest-core-server
          REMOTE
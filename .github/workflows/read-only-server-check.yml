name: Verify outage prevention
on:
  push:
    branches: [codex/read-only-server-check-20261102]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture vendor ingress via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          ssh -i "$keyfile" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          curl -sS --max-time 5 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=api.open-meteo.com&type=A'
          docker exec -i forest-core-server node --input-type=module <<'NODE'
          import {Resolver} from 'node:dns/promises';
          const r=new Resolver({timeout:1500,tries:1}); r.setServers(['1.1.1.1']);
          try { console.log('cloudflare-dns',await r.resolve4('api.open-meteo.com')); } catch(e){console.log('dns-error',e.code)}
          NODE
          curl -sS --max-time 6 --resolve api.open-meteo.com:443:167.114.211.86 -w '\nhttp=%{http_code} time=%{time_total}\n' 'https://api.open-meteo.com/v1/forecast?latitude=36.72&longitude=126.61&current=temperature_2m&timeformat=unixtime' || true
          REMOTE
